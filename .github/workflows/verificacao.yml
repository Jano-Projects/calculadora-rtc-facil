name: Verificação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analise-estatica:
    name: Análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Java compila sem avisos
        run: javac -Xlint:all -Werror -d /tmp/classes app/CalculadoraRTC.java
      - name: ShellCheck
        run: shellcheck iniciar.sh dev/*.sh
      - name: JavaScript válido
        run: |
          node --check web/app.js
          node --check web/exemplos.js
          node --check web/nfe.js
      - name: Python válido
        run: python3 -m py_compile dev/*.py
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path scripts/iniciar.ps1 -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          $r | Format-Table -AutoSize
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }

  fumaca:
    name: Teste de fumaça e de tela (motor simulado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Navegador para o teste de tela
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Banco de desenvolvimento
        run: bash dev/gerar_banco_dev.sh /tmp/calc-dev.db
      - name: Teste
        env:
          CALC_RTC_JAVA_HOME: ${{ env.JAVA_HOME }}
          TESTE_TELA: '1'
        run: bash dev/teste_fumaca.sh /tmp/calc-dev.db
